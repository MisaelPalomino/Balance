# ===============================
# CONFIGURACIÓN PRINCIPAL
# ===============================

# Deshabilitar Docker Compose (si no lo necesitas)
spring.docker.compose.enabled=false

# Database Configuration (usa variables de entorno)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/balance_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver